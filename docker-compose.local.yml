
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dot_net_backend_crm
    working_dir: /app

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      ConnectionStrings__DefaultConnection: ${ConnectionStrings_DefaultConnection:?Set ConnectionStrings__DefaultConnection in .env}
      Jwt__SecretKey: ${JWT_SECRET:?Set JWT_SECRET in .env}
      Jwt__Issuer: ${JWT_ISSUER:-Crm.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-Crm.Api}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      Jwt__RefreshTokenDays: ${JWT_REFRESH_TOKEN_DAYS:-7}
      Jwt__SessionAbsoluteDays: ${JWT_SESSION_ABSOLUTE_DAYS:-30}
    ports:
     - "5002:5000"

    volumes:
      - .:/app
      - backend_bin:/app/bin
      - backend_obj:/app/obj

    command:
      - dotnet
      - watch
      - run
      - --project
      - backend.csproj
      - --urls
      - http://0.0.0.0:5000

    networks:
      - crm

volumes:
  backend_bin:
  backend_obj:

networks:
  crm:
    name: dot-net-crm-local-network