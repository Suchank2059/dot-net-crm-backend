
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dot_net_backend_crm
    working_dir: /app

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      DOTNET_USE_POLLING_FILE_WATCHER: "1"

      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection:?Set ConnectionStrings__DefaultConnection in .env}
      Authentication__Jwt__SigningKeyBase64: ${AUTH_JWT_SIGNING_KEY:?Set AUTH_JWT_SIGNING_KEY in .env}
      DataProtection__KeysPath: /root/.aspnet/DataProtection-Keys
      Email__Smtp__Host: mailpit

    ports:
     - "5002:5000"

    depends_on:
      mailpit:
        condition: service_started

    volumes:
      - .:/app
      - backend_bin:/app/bin
      - backend_obj:/app/obj
      - backend_data_protection:/root/.aspnet/DataProtection-Keys

    command:
      - dotnet
      - watch
      - run
      - --project
      - backend.csproj
      - --urls
      - http://0.0.0.0:5000

    networks:
      - crm

volumes:
  backend_bin:
  backend_obj:
  backend_data_protection:

networks:
  crm:
    name: dot-net-crm-local-network